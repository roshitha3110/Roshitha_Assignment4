[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:playwright
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    multipage: Tests managing state across multiple pages
    forms: Tests for multi-step forms and input persistence
    conditional: Tests demonstrating conditional execution based on UI states
    auth: Tests utilizing authenticated sessions and storage state
    locators: Tests demonstrating semantic locators and filtering
    debugging: Tests used to demonstrate debugging, headed mode, and trace generation
